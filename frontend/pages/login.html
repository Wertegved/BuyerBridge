<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login | BuyerBridge</title>
    <meta name="description" content="Login to BuyerBridge to continue your buyer discovery workflow." />
    <link rel="stylesheet" href="../css/style.css" />
    <link rel="stylesheet" href="../css/responsive.css" />
    <link rel="stylesheet" href="../css/theme.css" />
  </head>
  <body>
    <header class="site-header auth-header">
      <div class="container auth-header-inner">
        <a class="brand brand-link" href="../index.html" data-brand-link aria-label="BuyerBridge home">
          <span class="brand-mark">B</span>
          <span>BuyerBridge</span>
        </a>
      </div>
    </header>

    <main class="container auth-shell">
      <section class="auth-card" aria-labelledby="login-title">
        <div class="auth-top">
          <div class="brand" aria-label="BuyerBridge home">
            <span class="brand-mark">B</span>
            <span>BuyerBridge</span>
          </div>
          <h1 id="login-title">Welcome back</h1>
          <p>Access your B2B buyer discovery workspace.</p>
        </div>

        <form id="login-form" class="auth-form" novalidate>
          <div class="field-group">
            <label for="login-email">Email</label>
            <input id="login-email" name="email" type="email" autocomplete="email" required />
          </div>

          <div class="field-group">
            <div class="field-row">
              <label for="login-password">Password</label>
              <a href="forgot-password.html" class="forgot-link" data-auth-link="forgot-password.html">Forgot Password?</a>
            </div>
            <input id="login-password" name="password" type="password" autocomplete="current-password" required />
          </div>

          <div data-auth-message class="auth-notice" aria-live="polite" hidden></div>

          <button class="button button-primary" type="submit">Login</button>
        </form>

        <p class="auth-footer">
          Need an account?
          <a href="signup.html" class="forgot-link" data-auth-link="signup.html">Sign up</a>
        </p>
      </section>
    </main>

    <script src="../js/api.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/components.js"></script>
    <script src="../js/theme.js"></script>
  </body>
</html>
