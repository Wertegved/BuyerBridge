<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Forgot Password | BuyerBridge</title>
    <meta name="description" content="Reset your BuyerBridge password securely." />
    <link rel="stylesheet" href="../css/style.css" />
    <link rel="stylesheet" href="../css/responsive.css" />
    <link rel="stylesheet" href="../css/theme.css" />
  </head>
  <body>
    <header class="site-header auth-header">
      <div class="container auth-header-inner">
        <a class="brand brand-link" href="../index.html" data-brand-link aria-label="BuyerBridge home">
          <span class="brand-mark">B</span>
          <span>BuyerBridge</span>
        </a>
      </div>
    </header>

    <main class="container auth-shell">
      <section class="auth-card" aria-labelledby="forgot-password-title">
        <div class="auth-top">
          <div class="brand" aria-label="BuyerBridge home">
            <span class="brand-mark">B</span>
            <span>BuyerBridge</span>
          </div>
          <h1 id="forgot-password-title">Forgot your password?</h1>
          <p>Enter your account email and we'll help you reset your password.</p>
        </div>

        <form id="forgot-password-form" class="auth-form" novalidate>
          <div class="field-group">
            <label for="forgot-email">Email</label>
            <input id="forgot-email" name="email" type="email" autocomplete="email" required />
          </div>

          <div data-auth-message class="auth-notice" aria-live="polite" hidden></div>

          <button class="button button-primary" type="submit">Continue</button>
        </form>

        <p class="auth-footer">
          <a href="login.html" class="forgot-link" data-auth-link="login.html">Back to Login</a>
        </p>
      </section>
    </main>

    <script src="../js/api.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/theme.js"></script>
  </body>
</html>
