version: '3.9'

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: buyerbridge
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d buyerbridge"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  api:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      APP_ENV: development
      DATABASE_URL: postgresql+psycopg://postgres:postgres@db:5432/buyerbridge
      FRONTEND_URL: http://localhost:5500
      SESSION_COOKIE_NAME: buyerbridge_session
      SESSION_EXPIRE_MINUTES: '30'
      SESSION_COOKIE_SECURE: 'false'
      SESSION_COOKIE_SAME_SITE: lax
      OVERPASS_API_URL: https://overpass-api.de/api/interpreter
      OVERPASS_USER_AGENT: BuyerBridge/1.0
      GEOCODING_API_URL: https://nominatim.openstreetmap.org/search
      GEOCODING_USER_AGENT: BuyerBridge/1.0
    depends_on:
      db:
        condition: service_healthy
    ports:
      - '8000:8000'
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  postgres_data:
